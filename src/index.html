<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Índice de guías de estudio.">
  <meta name="theme-color" content="#202b30">
  <title>Guías de estudio</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./catalog.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#coleccion">Saltar al índice</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="identity" href="./" aria-label="Guías de estudio, inicio">
        <span class="identity-mark" aria-hidden="true">A<span class="mark-dot">.</span></span>
        <span class="identity-name">Guías <small>de estudio</small></span>
      </a>
    </div>
  </header>

  <main id="coleccion">
    <section class="collection" aria-labelledby="collection-title">
      <div class="section-heading">
        <h1 id="collection-title">Guías disponibles</h1>
        <span class="collection-count">{{GUIDE_COUNT}} en total</span>
      </div>
      <div class="collection-tools">
        <label class="search-field" for="guide-search">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <input id="guide-search" type="search" placeholder="Buscar una guía" autocomplete="off" aria-controls="guide-list">
        </label>
      </div>
      <div class="guide-list" id="guide-list">
        {{GUIDE_CARDS}}
      </div>
      <p class="empty-search" id="empty-search" hidden>No hay resultados.</p>
    </section>
  </main>
</body>
</html>
